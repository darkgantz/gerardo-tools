<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tetris Móvil</title>
    <style>
        /* ... (Estilos CSS omitidos por brevedad, son los mismos de las versiones anteriores) ... */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; 
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            /* Se mantiene touch-action: manipulation en body */
            touch-action: manipulation; 
        }
        
        /* ... (El resto de estilos de game-container, canvas, controls, etc.) ... */

        .game-container {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px;
            max-width: 100vw;
            /* QUITAMOS el touch-action: none aquí para evitar bloqueo global */
        }
        
        canvas {
            /* ... estilos ... */
            display: block;
            /* QUITAMOS el touch-action: none aquí también */
        }
        
        .control-btn {
            /* ... estilos ... */
            touch-action: manipulation; 
            /* ... estilos ... */
        }

        /* [RESTO DE ESTILOS] */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 2000;
            transition: opacity 0.5s ease;
        }

        #splash-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #splash-screen h1 {
            font-size: 3em;
            margin-bottom: 50px;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .play-btn {
            background: #f0f000;
            color: #1e3c72;
            border: none;
            padding: 15px 60px;
            border-radius: 30px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            text-transform: uppercase;
        }
        
        .game-container {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px;
            max-width: 100vw;
        }

        .game-container.visible {
            display: flex;
        }

        .game-header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px 25px;
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .stat {
            text-align: center;
            color: white;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            margin-top: 5px;
        }

        .game-area {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            flex-wrap: wrap;
            justify-content: center;
        }

        .main-canvas-container {
            position: relative;
        }

        canvas {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            background: #000;
            display: block;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .next-piece-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .next-piece-container h3 {
            color: white;
            margin-bottom: 10px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #nextCanvas {
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(3, 70px);
            grid-template-rows: repeat(2, 70px);
            gap: 10px;
            margin-top: 20px;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            touch-action: manipulation; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .control-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.25);
        }

        .control-btn.rotate {
            grid-column: 2;
            grid-row: 1;
        }

        .control-btn.left {
            grid-column: 1;
            grid-row: 2;
        }

        .control-btn.down {
            grid-column: 2;
            grid-row: 2;
        }

        .control-btn.right {
            grid-column: 3;
            grid-row: 2;
        }

        .game-over-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .game-over-overlay.show {
            display: flex;
        }

        .game-over-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            color: white;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .pause-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        @media (max-width: 600px) {
            .controls {
                grid-template-columns: repeat(3, 60px);
                grid-template-rows: repeat(2, 60px);
            }
        }
    </style>
</head>
<body>
    
    <div id="splash-screen">
        <h1>TETRIS</h1>
        <button class="play-btn" id="playBtn">Play</button>
    </div>

    <div class="game-container" id="gameContainer">
        <div class="game-header">
            <div class="stat">
                <div class="stat-label">Score</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Level</div>
                <div class="stat-value" id="level">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">Lines</div>
                <div class="stat-value" id="lines">0</div>
            </div>
        </div>

        <div class="game-area">
            <div class="main-canvas-container">
                <canvas id="gameCanvas" width="300" height="600"></canvas>
                <button class="pause-btn" id="pauseBtn">⏸</button>
            </div>

            <div class="side-panel">
                <div class="next-piece-container">
                    <h3>Next</h3>
                    <canvas id="nextCanvas" width="120" height="120"></canvas>
                </div>

                <div class="controls">
                    <button class="control-btn rotate" id="rotateBtn">↻</button>
                    <button class="control-btn left" id="leftBtn">←</button>
                    <button class="control-btn down" id="downBtn">↓</button>
                    <button class="control-btn right" id="rightBtn">→</button>
                </div>
            </div>
        </div>
    </div>

    <div class="game-over-overlay" id="gameOverOverlay">
        <div class="game-over-content">
            <h2>Game Over!</h2>
            <p>Final Score: <span id="finalScore">0</span></p>
            <p>Level: <span id="finalLevel">1</span></p>
            <p>Lines: <span id="finalLines">0</span></p>
            <button class="restart-btn" id="restartBtn">Play Again</button>
        </div>
    </div>

    <script>

        const nextCanvas = document.getElementById('nextCanvas');
        const nextCtx = nextCanvas.getContext('2d');
        const gameContainer = document.getElementById('gameContainer');
        const splashScreen = document.getElementById('splash-screen');
        const playBtn = document.getElementById('playBtn');

        const COLS = 10;
        const ROWS = 20;
        const BLOCK_SIZE = 30;

        const PIECES = [
            { shape: [[1,1,1,1]], color: '#00f0f0' },
            { shape: [[1,1],[1,1]], color: '#f0f000' },
            { shape: [[0,1,0],[1,1,1]], color: '#a000f0' },
            { shape: [[1,0,0],[1,1,1]], color: '#f0a000' },
            { shape: [[0,0,1],[1,1,1]], color: '#0000f0' },
            { shape: [[0,1,1],[1,1,0]], color: '#00f000' },
            { shape: [[1,1,0],[0,1,1]], color: '#f00000' }
        ];

        let board = Array(ROWS).fill().map(() => Array(COLS).fill(0));
        let currentPiece = null;
        let nextPiece = null;
        let score = 0;
        let level = 1;
        let lines = 0;
        let gameOver = false;
        let paused = false;
        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;

        // --- LÓGICA DE AUDIO (Simplificada) ---
        let audioContext = null; 
        function initAudio() {
            if (!audioContext) {
                 audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        function playSound() {}
        function playMoveSound() {}
        function playRotateSound() {}
        function playLineSound() {}
        function playGameOverSound() {}
        function playLevelUpSound() {}
        // --- FIN LÓGICA DE AUDIO ---
        
        // --- FUNCIONES DE JUEGO (Mantenidas) ---
        function createPiece() { /* ... */
            const piece = PIECES[Math.floor(Math.random() * PIECES.length)];
            return {

        function drawBlock(ctx, x, y, color) { /* ... */ }

        function drawPiece(piece, context = ctx, offsetX = 0, offsetY = 0) { /* ... */ }
        function drawNext() { /* ... */ }
        function collide(piece) { /* ... */ }
        function merge() { /* ... */ }
        function rotate() { /* ... */ }
        function clearLines() { /* ... */ }
        function updateStats() { /* ... */ }
        function moveDown() { /* ... */ }
        function moveLeft() { /* ... */ }
        function moveRight() { /* ... */ }
        function hardDrop() { /* ... */ }
        function endGame() { /* ... */ }
        function resetGame() { /* ... */ }
        function togglePause() { /* ... */ }
        function update(time = 0) { /* ... */ }
        
        // --- Lógica de Pantalla Completa ---
        function requestFullscreen(element) {
            if (element.requestFullscreen) {
                element.requestFullscreen();
            } else if (element.webkitRequestFullscreen) { 
                element.webkitRequestFullscreen();
            } else if (element.mozRequestFullScreen) {
                element.mozRequestFullScreen();
            } else if (element.msRequestFullscreen) {
                element.msRequestFullscreen();
            }
        }

        playBtn.addEventListener('click', () => {
            const rootElement = document.documentElement;
            requestFullscreen(rootElement); 
            
            splashScreen.classList.add('hidden');
            gameContainer.classList.add('visible');

            initAudio();
            resetGame();
            update();
        });
        
        // --- MANEJO DE EVENTOS TÁCTILES SIMPLIFICADO (SOLO BOTONES) ---

        const handleTouchAction = (action) => (e) => {
            // Este es el único lugar donde usamos e.preventDefault(), y solo en el evento touchstart
            e.preventDefault(); 
            if (!gameOver && !paused) {
                action();
            }
            e.target.blur(); 
        };

        // Asignación de eventos touch a los botones:
        document.getElementById('leftBtn').addEventListener('touchstart', handleTouchAction(moveLeft), { passive: false });
        document.getElementById('rightBtn').addEventListener('touchstart', handleTouchAction(moveRight), { passive: false });
        document.getElementById('downBtn').addEventListener('touchstart', handleTouchAction(hardDrop), { passive: false }); 
        document.getElementById('rotateBtn').addEventListener('touchstart', handleTouchAction(rotate), { passive: false });

        document.getElementById('pauseBtn').addEventListener('click', togglePause);
        document.getElementById('restartBtn').addEventListener('click', resetGame);
        
        // --- ELIMINACIÓN DE LÓGICA AGRESIVA DE SWIPE ---
        // (touchmove, touchend y listeners del gameContainer eliminados para evitar conflictos)


        // Control de teclado para escritorio
        document.addEventListener('keydown', (e) => {
            if (gameOver || paused) return;

            switch(e.key) {
                case 'ArrowLeft':
                case 'ArrowRight':
                case 'ArrowDown':
                case 'ArrowUp':
                case ' ':
                    e.preventDefault();
                    if (e.key === 'ArrowLeft') moveLeft();
                    else if (e.key === 'ArrowRight') moveRight();
                    else if (e.key === 'ArrowDown') { moveDown(); dropCounter = 0; }
                    else if (e.key === 'ArrowUp') rotate();
                    else if (e.key === ' ') hardDrop();
                    break;
            }
        });
        
    </script>
</body>
</html>
