<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tetris Móvil</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; /* Elimina el recuadro azul al tocar en Android */
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            /* CRUCIAL para el touch en móviles: evita que el navegador intente hacer scroll/zoom */
            touch-action: manipulation; 
        }

        /* --- Estilos para la Pantalla de Inicio --- */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 2000;
            transition: opacity 0.5s ease;
        }

        #splash-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #splash-screen h1 {
            font-size: 3em;
            margin-bottom: 50px;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .play-btn {
            background: #f0f000;
            color: #1e3c72;
            border: none;
            padding: 15px 60px;
            border-radius: 30px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            text-transform: uppercase;
        }

        .play-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }
        /* ----------------------------------------- */
        
        .game-container {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px;
            max-width: 100vw;
        }

        .game-container.visible {
            display: flex;
        }

        .game-header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px 25px;
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .stat {
            text-align: center;
            color: white;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            margin-top: 5px;
        }

        .game-area {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            flex-wrap: wrap;
            justify-content: center;
        }

        .main-canvas-container {
            position: relative;
        }

        canvas {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            background: #000;
            display: block;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .next-piece-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .next-piece-container h3 {
            color: white;
            margin-bottom: 10px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #nextCanvas {
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(3, 70px);
            grid-template-rows: repeat(2, 70px);
            gap: 10px;
            margin-top: 20px;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            /* CRUCIAL para los botones: permiten que el touch se registre sin problemas */
            touch-action: manipulation; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .control-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.25);
        }

        .control-btn.rotate {
            grid-column: 2;
            grid-row: 1;
        }

        .control-btn.left {
            grid-column: 1;
            grid-row: 2;
        }

        .control-btn.down {
            grid-column: 2;
            grid-row: 2;
        }

        .control-btn.right {
            grid-column: 3;
            grid-row: 2;
        }

        .game-over-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .game-over-overlay.show {
            display: flex;
        }

        .game-over-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            color: white;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .game-over-content h2 {
            font-size: 36px;
            margin-bottom: 20px;
        }

        .game-over-content p {
            font-size: 20px;
            margin: 10px 0;
            opacity: 0.9;
        }

        .restart-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 25px;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .restart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .pause-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .pause-btn:active {
            transform: scale(0.95);
        }

        @media (max-width: 600px) {
            .game-container {
                padding: 10px;
            }

            .game-header {
                gap: 15px;
                padding: 10px 15px;
            }

            .stat-value {
                font-size: 20px;
            }

            .controls {
                grid-template-columns: repeat(3, 60px);
                grid-template-rows: repeat(2, 60px);
            }

            .control-btn {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    
    <div id="splash-screen">
        <h1>TETRIS</h1>
        <button class="play-btn" id="playBtn">Play</button>
    </div>

    <div class="game-container" id="gameContainer">
        <div class="game-header">
            <div class="stat">
                <div class="stat-label">Score</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Level</div>
                <div class="stat-value" id="level">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">Lines</div>
                <div class="stat-value" id="lines">0</div>
            </div>
        </div>

        <div class="game-area">
            <div class="main-canvas-container">
                <canvas id="gameCanvas" width="300" height="600"></canvas>
                <button class="pause-btn" id="pauseBtn">⏸</button>
            </div>

            <div class="side-panel">
                <div class="next-piece-container">
                    <h3>Next</h3>
                    <canvas id="nextCanvas" width="120" height="120"></canvas>
                </div>

                <div class="controls">
                    <button class="control-btn rotate" id="rotateBtn">↻</button>
                    <button class="control-btn left" id="leftBtn">←</button>
                    <button class="control-btn down" id="downBtn">↓</button>
                    <button class="control-btn right" id="rightBtn">→</button>
                </div>
            </div>
        </div>
    </div>

    <div class="game-over-overlay" id="gameOverOverlay">
        <div class="game-over-content">
            <h2>Game Over!</h2>
            <p>Final Score: <span id="finalScore">0</span></p>
            <p>Level: <span id="finalLevel">1</span></p>
            <p>Lines: <span id="finalLines">0</span></p>
            <button class="restart-btn" id="restartBtn">Play Again</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const nextCanvas = document.getElementById('nextCanvas');
        const nextCtx = nextCanvas.getContext('2d');
        const gameContainer = document.getElementById('gameContainer');
        const splashScreen = document.getElementById('splash-screen');
        const playBtn = document.getElementById('playBtn');

        const COLS = 10;
        const ROWS = 20;
        const BLOCK_SIZE = 30;

        const PIECES = [
            { shape: [[1,1,1,1]], color: '#00f0f0' },
            { shape: [[1,1],[1,1]], color: '#f0f000' },
            { shape: [[0,1,0],[1,1,1]], color: '#a000f0' },
            { shape: [[1,0,0],[1,1,1]], color: '#f0a000' },
            { shape: [[0,0,1],[1,1,1]], color: '#0000f0' },
            { shape: [[0,1,1],[1,1,0]], color: '#00f000' },
            { shape: [[1,1,0],[0,1,1]], color: '#f00000' }
        ];

        let board = Array(ROWS).fill().map(() => Array(COLS).fill(0));
        let currentPiece = null;
        let nextPiece = null;
        let score = 0;
        let level = 1;
        let lines = 0;
        let gameOver = false;
        let paused = false;
        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;

        let audioContext = null; 

        function initAudio() {
            // Inicializa el contexto de audio. Necesita una interacción de usuario previa (el clic de Play)
            if (!audioContext) {
                 audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(frequency, duration, type = 'sine') {
            if (!audioContext) return; 
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.value = frequency;
            oscillator.type = type;

            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + duration);
        }

        function playMoveSound() { playSound(200, 0.05); }
        function playRotateSound() { playSound(300, 0.05); }
        function playLineSound() {
            playSound(440, 0.1);
            setTimeout(() => playSound(550, 0.1), 100);
            setTimeout(() => playSound(660, 0.15), 200);
        }
        function playGameOverSound() {
            playSound(440, 0.2);
            setTimeout(() => playSound(370, 0.2), 200);
            setTimeout(() => playSound(330, 0.3), 400);
        }
        function playLevelUpSound() {
            playSound(523, 0.1);
            setTimeout(() => playSound(659, 0.1), 100);
            setTimeout(() => playSound(784, 0.2), 200);
        }

        function createPiece() {
            const piece = PIECES[Math.floor(Math.random() * PIECES.length)];
            return {
                shape: piece.shape.map(row => [...row]),
                color: piece.color,
                x: Math.floor(COLS / 2) - Math.floor(piece.shape[0].length / 2),
                y: 0
            };
        }

        function drawBlock(ctx, x, y, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);

            ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.lineWidth = 2;
            ctx.strokeRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);

            const gradient = ctx.createLinearGradient(
                x * BLOCK_SIZE, y * BLOCK_SIZE,
                x * BLOCK_SIZE + BLOCK_SIZE, y * BLOCK_SIZE + BLOCK_SIZE
            );
            gradient.addColorStop(0, 'rgba(255, 255, 255, 0.3)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0.3)');
            ctx.fillStyle = gradient;
            ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
        }

        function drawBoard() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (board[y][x]) {
                        drawBlock(ctx, x, y, board[y][x]);
                    }
                }
            }
        }

        function drawPiece(piece, context = ctx, offsetX = 0, offsetY = 0) {
            piece.shape.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value) {
                        drawBlock(context, piece.x + x + offsetX, piece.y + y + offsetY, piece.color);
                    }
                });
            });
        }

        function drawNext() {
            nextCtx.fillStyle = '#000';
            nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);

            if (nextPiece) {
                const blockSizeNext = 30; 
                const offsetX = 2 - nextPiece.shape[0].length / 2;
                const offsetY = 2 - nextPiece.shape.length / 2;
                
                nextPiece.shape.forEach((row, y) => {
                    row.forEach((value, x) => {
                        if (value) {
                            nextCtx.fillStyle = nextPiece.color;
                            nextCtx.fillRect((x + offsetX) * blockSizeNext, (y + offsetY) * blockSizeNext, blockSizeNext, blockSizeNext);
                            
                            nextCtx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
                            nextCtx.lineWidth = 2;
                            nextCtx.strokeRect((x + offsetX) * blockSizeNext, (y + offsetY) * blockSizeNext, blockSizeNext, blockSizeNext);
                        }
                    });
                });
            }
        }

        function collide(piece) {
            for (let y = 0; y < piece.shape.length; y++) {
                for (let x = 0; x < piece.shape[y].length; x++) {
                    if (piece.shape[y][x]) {
                        const newX = piece.x + x;
                        const newY = piece.y + y;

                        if (newX < 0 || newX >= COLS || newY >= ROWS) {
                            return true;
                        }

                        if (newY >= 0 && board[newY][newX]) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        function merge() {
            currentPiece.shape.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value) {
                        const boardY = currentPiece.y + y;
                        const boardX = currentPiece.x + x;
                        if (boardY >= 0) {
                            board[boardY][boardX] = currentPiece.color;
                        }
                    }
                });
            });
        }

        function rotate() {
            const rotated = currentPiece.shape[0].map((_, i) =>
                currentPiece.shape.map(row => row[i]).reverse()
            );

            const previousShape = currentPiece.shape;
            currentPiece.shape = rotated;

            const offsets = [0, 1, -1, 2, -2];
            for (let offset of offsets) {
                currentPiece.x += offset;
                if (!collide(currentPiece)) {
                    playRotateSound();
                    return;
                }
                currentPiece.x -= offset;
            }
            
            currentPiece.shape = previousShape;
        }


        function clearLines() {
            let linesCleared = 0;

            for (let y = ROWS - 1; y >= 0; y--) {
                if (board[y].every(cell => cell !== 0)) {
                    board.splice(y, 1);
                    board.unshift(Array(COLS).fill(0));
                    linesCleared++;
                    y++;
                }
            }

            if (linesCleared > 0) {
                playLineSound();
                lines += linesCleared;
                score += [0, 40, 100, 300, 1200][linesCleared] * level; 

                const newLevel = Math.floor(lines / 10) + 1;
                if (newLevel > level) {
                    level = newLevel;
                    dropInterval = Math.max(100, 1000 - (level - 1) * 100); 
                    playLevelUpSound();
                }

                updateStats();
            }
        }

        function updateStats() {
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('lines').textContent = lines;
        }

        function moveDown() {
            currentPiece.y++;
            if (collide(currentPiece)) {
                currentPiece.y--;
                merge();
                clearLines();
                currentPiece = nextPiece;
                nextPiece = createPiece();
                drawNext();

                if (collide(currentPiece)) {
                    endGame();
                }
                return true; 
            }
            return false; 
        }

        function moveLeft() {
            currentPiece.x--;
            if (collide(currentPiece)) {
                currentPiece.x++;
                return false;
            } else {
                playMoveSound();
                return true;
            }
        }

        function moveRight() {
            currentPiece.x++;
            if (collide(currentPiece)) {
                currentPiece.x++;
                return false;
            } else {
                playMoveSound();
                return true;
            }
        }

        function hardDrop() {
            let yBefore = currentPiece.y;
            while (!collide(currentPiece)) {
                currentPiece.y++;
            }
            currentPiece.y--;
            if (currentPiece.y > yBefore) {
                playMoveSound();
                moveDown(); 
            }
        }

        function endGame() {
            gameOver = true;
            playGameOverSound();
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalLevel').textContent = level;
            document.getElementById('finalLines').textContent = lines;
            document.getElementById('gameOverOverlay').classList.add('show');
        }

        function resetGame() {
            board = Array(ROWS).fill().map(() => Array(COLS).fill(0));
            score = 0;
            level = 1;
            lines = 0;
            gameOver = false;
            paused = false;
            dropInterval = 1000;
            currentPiece = createPiece();
            nextPiece = createPiece();
            updateStats();
            drawNext();
            document.getElementById('gameOverOverlay').classList.remove('show');
            document.getElementById('pauseBtn').textContent = '⏸';
        }

        function togglePause() {
            if (!gameOver) {
                paused = !paused;
                document.getElementById('pauseBtn').textContent = paused ? '▶' : '⏸';
                if (!paused) {
                    lastTime = performance.now(); 
                    update(); 
                }
            }
        }

        function update(time = 0) {
            if (gameOver || paused) {
                return; 
            }

            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;

            if (dropCounter > dropInterval) {
                moveDown();
                dropCounter = 0;
            }

            drawBoard();
            drawPiece(currentPiece);

            requestAnimationFrame(update);
        }

        // --- Lógica de Pantalla Completa (REVISADA) ---
        
        function requestFullscreen(element) {
            // Usa el prefijo webkit (para Chrome/Android) y la sintaxis estándar
            if (element.requestFullscreen) {
                element.requestFullscreen();
            } else if (element.webkitRequestFullscreen) { 
                element.webkitRequestFullscreen();
            } else if (element.mozRequestFullScreen) {
                element.mozRequestFullScreen();
            } else if (element.msRequestFullscreen) {
                element.msRequestFullscreen();
            }
        }

        playBtn.addEventListener('click', () => {
            // Usa document.documentElement (el tag <html>) para máxima compatibilidad móvil.
            const rootElement = document.documentElement;
            requestFullscreen(rootElement); 
            
            // Oculta la pantalla de inicio y muestra el juego
            splashScreen.classList.add('hidden');
            gameContainer.classList.add('visible');

            // Inicializa el audio y el juego
            initAudio();
            resetGame();
            update();
        });
        
        // --- Manejo de Eventos Táctiles (CRUCIALES) ---

        // Función genérica para manejar el "tap" y evitar problemas de eventos
        const handleTouchAction = (action) => (e) => {
            e.preventDefault(); // IMPIDE que el navegador interprete el toque como scroll o zoom
            if (!gameOver && !paused) {
                action();
            }
            e.target.blur(); 
        };

        // Asignación de eventos touch:
        
        // Usamos touchstart para una respuesta instantánea en móviles (Chrome/Android)
        document.getElementById('leftBtn').addEventListener('touchstart', handleTouchAction(moveLeft));
        document.getElementById('rightBtn').addEventListener('touchstart', handleTouchAction(moveRight));
        document.getElementById('downBtn').addEventListener('touchstart', handleTouchAction(hardDrop)); // Hard drop para el botón de abajo es lo usual
        document.getElementById('rotateBtn').addEventListener('touchstart', handleTouchAction(rotate));
        
        // Mantenemos los eventos de click/mousedown como respaldo para otros contextos
        document.getElementById('leftBtn').addEventListener('mousedown', handleTouchAction(moveLeft));
        document.getElementById('rightBtn').addEventListener('mousedown', handleTouchAction(moveRight));
        document.getElementById('downBtn').addEventListener('mousedown', handleTouchAction(hardDrop));
        document.getElementById('rotateBtn').addEventListener('mousedown', handleTouchAction(rotate));
        
        // Controles de juego
        document.getElementById('pauseBtn').addEventListener('click', togglePause);
        document.getElementById('restartBtn').addEventListener('click', resetGame);

        // Control de teclado para escritorio (si lo necesitas)
        document.addEventListener('keydown', (e) => {
            if (gameOver || paused) return;

            switch(e.key) {
                case 'ArrowLeft':
                    e.preventDefault(); 
                    moveLeft();
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    moveRight();
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    moveDown();
                    dropCounter = 0;
                    break;
                case 'ArrowUp':
                    e.preventDefault();
                    rotate();
                    break;
                case ' ':
                    e.preventDefault();
                    hardDrop();
                    break;
            }
        });
        
    </script>
</body>
</html>
