<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Player V12 - CSS Optimizado</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --primary: #e50914; --dark: #121212; --sidebar: #000000; --border: #333; }
        body { font-family: sans-serif; background: var(--dark); color: white; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Layout */
        #sidebar { width: 340px; background: var(--sidebar); display: flex; flex-direction: column; border-right: 1px solid var(--border); flex-shrink: 0; }
        #main { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; }
        
        /* Paneles */
        .panel { padding: 15px; border-bottom: 1px solid var(--border); background: #1a1a1a; display: flex; flex-direction: column; gap:10px; }
        .hidden { display: none !important; }
        
        /* Inputs y Botones */
        input, select { width: 100%; padding: 10px; background: #333; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        
        .btn-row { display: flex; gap: 5px; }
        button { padding: 10px; cursor: pointer; border: none; border-radius: 4px; color: white; font-weight: bold; flex: 1; transition: 0.2s; font-size: 13px; }
        .btn-play { background: var(--primary); } .btn-play:hover { background: #b0060f; }
        .btn-add { background: #28a745; } .btn-add:hover { background: #1e7e34; }
        .btn-del { background: #dc3545; max-width: 50px; font-size: 16px; } .btn-del:hover { background: #a71d2a; }
        .btn-back { background: #444; width: 100%; }

        /* Lista de Canales (Contenedores) */
        
        /* El panel principal debe ocupar todo el espacio restante en el sidebar */
        #panel-channels { 
            flex: 1; 
            display: flex !important; 
            flex-direction: column; 
            padding: 0 !important; 
        } 
        
        /* El listado de canales (donde va el scroll) */
        #channel-list { 
            overflow-y: auto; 
            min-height: 0; 
            height: 100vh;
        }
        
        .channel { padding: 8px 15px; border-bottom: 1px solid #222; cursor: pointer; display: flex; align-items: center; font-size: 14px; transition: background 0.2s; }
        .channel:hover { background: #222; }
        .channel.active { background: #333; border-left: 4px solid var(--primary); }
        
        /* LOGOS */
        .ch-logo { width: 35px; height: 35px; margin-right: 12px; object-fit: contain; background: #000; border-radius: 4px; border: 1px solid #333; }

        /* Video */
        video { width: 100%; height: 100%; }
        #overlay { position: absolute; top:0; left:0; width:100%; height:100%; display:flex; align-items:center; justify-content:center; pointer-events:none; background: rgba(0,0,0,0.8); z-index: 10; }
        #status-text { color: #fff; font-size: 1.2rem; background: #000; padding: 15px 25px; border-radius: 8px; border: 1px solid #333; }
        
        /* Formulario Agregar */
        #form-add { border-top: 1px solid #444; padding-top: 10px; margin-top: 5px; }

        /* --- ESTILO DEL MODAL PERSONALIZADO --- */
        #custom-dialog {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            display: flex; justify-content: center; align-items: center; z-index: 1000; 
        }
        .dialog-hidden { display: none !important; }
        .dialog-content {
            background: #1a1a1a; padding: 20px; border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5); width: 300px; color: white; border: 1px solid #444;
        }
        #dialog-message { margin-top: 0; margin-bottom: 20px; font-size: 1rem; }
        .dialog-buttons { display: flex; justify-content: flex-end; gap: 10px; }
        .dialog-buttons button { padding: 8px 15px; font-weight: normal; flex: none; font-size: 14px; }
        #dialog-ok { background: var(--primary); }
        #dialog-cancel { background: #444; }
    </style>
</head>
<body>

<div id="sidebar">
    
    <div id="panel-manager" class="panel">
        <div style="font-size:12px; color:#aaa; font-weight:bold; letter-spacing:1px;">MIS LISTAS</div>
        
        <div class="btn-row">
            <select id="listSelect"></select>
            <button class="btn-del" onclick="deleteList()" title="Borrar lista seleccionada">🗑️</button>
        </div>
        
        <div class="btn-row">
            <button class="btn-play" onclick="loadContent('SINGLE')">▶ Cargar Lista</button>
            <button class="btn-play" style="background:#444" onclick="loadContent('ALL')">★ Cargar Todo</button>
        </div>
        
        <button class="btn-add" style="width:100%" onclick="toggleForm()">+ Nueva Lista</button>

        <div id="form-add" class="hidden">
            <input id="inpName" placeholder="Nombre (ej: Deportes)">
            <input id="inpUrl" placeholder="URL https://...">
            <button class="btn-add" style="width:100%" onclick="addListAndLoad()">GUARDAR Y CARGAR</button>
        </div>
    </div>

    <div id="panel-channels" class="hidden"> 
        <div style="padding:10px; background:#1a1a1a; border-bottom:1px solid #333;">
            <button class="btn-back" onclick="showManager()">⬅ Volver a Mis Listas</button> 
            <input id="search" placeholder="🔍 Buscar canal..." onkeyup="renderChannels()" style="margin:10px 0 0 0;">
        </div>
        <div id="channel-list"></div>
    </div>

</div>

<div id="main">
    <video id="video" controls autoplay></video>
    <div id="overlay">
        <div id="status-text">Selecciona una lista o agrega una nueva</div>
    </div>
</div>

<div id="custom-dialog" class="dialog-hidden">
    <div class="dialog-content">
        <p id="dialog-message">Mensaje de Confirmación</p>
        <div class="dialog-buttons">
            <button id="dialog-cancel">Cancelar</button>
            <button id="dialog-ok">Eliminar</button>
        </div>
    </div>
</div>


<script>
    // CLAVE DE MEMORIA
    const DB_ID = "iptv_v12_final"; 
    
    let playlists = [];
    let activeChannels = [];
    let hls;
    const video = document.getElementById('video');

    // --- FUNCIONES DEL MODAL PERSONALIZADO ---

    function showConfirm(message) {
        return new Promise(resolve => {
            const dialog = document.getElementById('custom-dialog');
            const msgEl = document.getElementById('dialog-message');
            const okBtn = document.getElementById('dialog-ok');
            const cancelBtn = document.getElementById('dialog-cancel');
            
            msgEl.innerText = message;
            dialog.classList.remove('dialog-hidden');

            const resolveAndHide = (result) => {
                dialog.classList.add('dialog-hidden');
                okBtn.removeEventListener('click', okHandler);
                cancelBtn.removeEventListener('click', cancelHandler);
                resolve(result);
            };

            const okHandler = () => resolveAndHide(true);
            const cancelHandler = () => resolveAndHide(false);

            okBtn.addEventListener('click', okHandler);
            cancelBtn.addEventListener('click', cancelHandler);
        });
    }

    // --- INICIO ---
    window.onload = () => {
        try {
            let data = localStorage.getItem(DB_ID);
            if(data) playlists = JSON.parse(data);
        } catch(e) {}
        
        updateUI();
    };

    // --- GESTIÓN DE DATOS ---
    function save(refreshUI = true) {
        localStorage.setItem(DB_ID, JSON.stringify(playlists));
        if(refreshUI) updateUI();
    }

    function updateUI() {
        const sel = document.getElementById('listSelect');
        const previousValue = sel.value; 
        
        sel.innerHTML = "";
        
        if (playlists.length === 0) {
            let opt = document.createElement('option');
            opt.text = "-- Sin listas --";
            sel.appendChild(opt);
            return;
        }

        playlists.forEach((l, i) => {
            let opt = document.createElement('option');
            opt.value = i;
            opt.innerText = l.name;
            sel.appendChild(opt);
        });

        if (previousValue !== "" && playlists[previousValue]) {
            sel.value = previousValue;
        } else {
            sel.value = 0; 
        }
    }

    function toggleForm() {
        document.getElementById('form-add').classList.toggle('hidden');
    }

    // --- AGREGAR Y CARGAR ---
    function addListAndLoad() {
        const name = document.getElementById('inpName').value.trim();
        const url = document.getElementById('inpUrl').value.trim();
        
        if(!url.startsWith('https')) return alert("⚠️ Solo se permiten listas HTTPS");
        if(!name || !url) return alert("Completa los datos");

        playlists.push({name, url});
        save(false); 

        // Limpiar form
        document.getElementById('inpName').value = "";
        document.getElementById('inpUrl').value = "";
        document.getElementById('form-add').classList.add('hidden');

        const newIndex = playlists.length - 1;
        updateUI(); 
        document.getElementById('listSelect').value = newIndex; 

        // Cargar
        loadContent('SINGLE');
    }

    // --- BORRAR LISTA (CON MODAL PERSONALIZADO) ---
    async function deleteList() {
        const sel = document.getElementById('listSelect');
        const idx = parseInt(sel.value); 

        if (isNaN(idx) || idx < 0 || idx >= playlists.length) {
            return alert("No hay una lista válida seleccionada.");
        }

        const listName = playlists[idx].name;

        const isConfirmed = await showConfirm(`¿Estás seguro de eliminar la lista: "${listName}"?`);

        if(isConfirmed) {
            playlists.splice(idx, 1); 
            save(true); 
            
            if (playlists.length === 0) {
                showManager();
            }
        }
    }

    // --- MOTOR DE CARGA ---
    async function loadContent(mode) {
        const overlay = document.getElementById('overlay');
        const status = document.getElementById('status-text');
        
        overlay.style.display = 'flex';
        status.innerText = "Descargando canales...";
        activeChannels = [];

        let urlsToLoad = [];
        
        if(mode === 'ALL') {
            urlsToLoad = playlists.map(p => p.url);
        } else {
            const idx = parseInt(document.getElementById('listSelect').value);
            if (isNaN(idx) || !playlists[idx]) {
                status.innerText = "Selecciona una lista válida.";
                setTimeout(() => { overlay.style.display = 'none'; }, 2000);
                return;
            }
            urlsToLoad = [playlists[idx].url];
        }

        const promises = urlsToLoad.map(url => 
            fetch('https://corsproxy.io/?' + encodeURIComponent(url))
            .then(r => r.text())
            .catch(e => "")
        );

        const results = await Promise.all(promises);
        results.forEach(txt => parseM3U(txt));

        if(activeChannels.length > 0) {
            // OCULTAR GESTOR y MOSTRAR CANALES
            document.getElementById('panel-manager').classList.add('hidden');
            document.getElementById('panel-channels').classList.remove('hidden'); 
            
            renderChannels();
            overlay.style.display = 'none';
        } else {
            status.innerText = "Error: No se encontraron canales HTTPS.";
            setTimeout(() => { overlay.style.display = 'none'; }, 2000);
        }
    }

    // --- PARSEO ---
    function parseM3U(data) {
        const lines = data.split('\n');
        let name = "", logo = "";
        
        lines.forEach(line => {
            line = line.trim();
            if(line.startsWith('#EXTINF:')) {
                name = line.split(',').pop().trim();
                let logoMatch = line.match(/tvg-logo="([^"]*)"/);
                logo = logoMatch ? logoMatch[1] : "";
            } else if(line.startsWith('https://') && name) {
                activeChannels.push({name, logo, url: line});
                name = ""; logo = "";
            }
        });
    }

    // --- RENDERIZADO ---
    function renderChannels() {
        const term = document.getElementById('search').value.toLowerCase();
        const container = document.getElementById('channel-list');
        container.innerHTML = "";

        const filtered = activeChannels.filter(c => c.name.toLowerCase().includes(term));

        filtered.slice(0, 500).forEach(ch => {
            let div = document.createElement('div');
            div.className = 'channel';
            
            let logoHTML = ch.logo ? 
                `<img src="${ch.logo}" class="ch-logo" onerror="this.style.display='none'">` : '';

            div.innerHTML = `${logoHTML}<span>${ch.name}</span>`;
            div.onclick = () => play(ch.url, div);
            container.appendChild(div);
        });
    }
    
    // --- FUNCIÓN showManager (Muestra el gestor y oculta los canales) ---
    function showManager() {
        // OCULTAR CANALES y MOSTRAR GESTOR
        document.getElementById('panel-channels').classList.add('hidden');
        document.getElementById('panel-manager').classList.remove('hidden');

        // Muestra el overlay de estado
        document.getElementById('overlay').style.display = 'flex';
        document.getElementById('status-text').innerText = "Selecciona una lista";
        
        // Detiene el reproductor
        if (hls) {
            hls.destroy();
        }
        video.pause();
        video.src = "";
    }

    function play(url, el) {
        document.querySelectorAll('.channel').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        
        if(Hls.isSupported()) {
            if(hls) hls.destroy();
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        } else if(video.canPlayType('application/vnd.apple.mpegurl')) {
            if(hls) hls.destroy();
            video.src = url;
            video.play();
        }
    }
</script>

</body>
</html>
