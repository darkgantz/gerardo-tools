<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Player V5 - AutoLoad & Logos</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --primary: #e50914; --dark: #121212; --sidebar: #000000; --border: #333; }
        body { font-family: sans-serif; background: var(--dark); color: white; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Layout */
        #sidebar { width: 340px; background: var(--sidebar); display: flex; flex-direction: column; border-right: 1px solid var(--border); flex-shrink: 0; }
        #main { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; }
        
        /* Paneles */
        .panel { padding: 15px; border-bottom: 1px solid var(--border); background: #1a1a1a; display: flex; flex-direction: column; gap:10px; }
        .hidden { display: none !important; }
        
        /* Inputs y Botones */
        input, select { width: 100%; padding: 10px; background: #333; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box; }
        
        .btn-row { display: flex; gap: 5px; }
        button { padding: 10px; cursor: pointer; border: none; border-radius: 4px; color: white; font-weight: bold; flex: 1; transition: 0.2s; }
        .btn-play { background: var(--primary); } .btn-play:hover { background: #b0060f; }
        .btn-add { background: #28a745; } .btn-add:hover { background: #1e7e34; }
        .btn-del { background: #dc3545; max-width: 50px; } 
        .btn-back { background: #444; width: 100%; }

        /* Lista de Canales */
        #channel-list { flex: 1; overflow-y: auto; }
        
        .channel { padding: 8px 15px; border-bottom: 1px solid #222; cursor: pointer; display: flex; align-items: center; font-size: 14px; transition: background 0.2s; }
        .channel:hover { background: #222; }
        .channel.active { background: #333; border-left: 4px solid var(--primary); }
        
        /* LOGOS (Reincorporados) */
        .ch-logo { width: 35px; height: 35px; margin-right: 12px; object-fit: contain; background: #000; border-radius: 4px; border: 1px solid #333; }

        /* Video */
        video { width: 100%; height: 100%; }
        #overlay { position: absolute; top:0; left:0; width:100%; height:100%; display:flex; align-items:center; justify-content:center; pointer-events:none; background: rgba(0,0,0,0.7); z-index: 10; }
        #status-text { color: #fff; font-size: 1.2rem; background: #000; padding: 10px 20px; border-radius: 5px; }
        
        /* Formulario Agregar */
        #form-add { border-top: 1px solid #444; padding-top: 10px; margin-top: 5px; }
    </style>
</head>
<body>

<div id="sidebar">
    
    <div id="panel-manager" class="panel">
        <div style="font-size:12px; color:#aaa; font-weight:bold;">MIS LISTAS GUARDADAS</div>
        
        <div class="btn-row">
            <select id="listSelect"></select>
            <button class="btn-del" onclick="deleteList()" title="Borrar seleccionada">🗑️</button>
        </div>
        
        <div class="btn-row">
            <button class="btn-play" onclick="loadContent('SINGLE')">▶ Cargar Lista</button>
            <button class="btn-play" style="background:#444" onclick="loadContent('ALL')">★ Cargar Todo</button>
        </div>
        
        <button class="btn-add" style="width:100%" onclick="toggleForm()">+ Nueva Lista</button>

        <div id="form-add" class="hidden">
            <input id="inpName" placeholder="Nombre (ej: Deportes)">
            <input id="inpUrl" placeholder="URL https://...">
            <button class="btn-add" style="width:100%" onclick="addListAndLoad()">GUARDAR Y CARGAR</button>
        </div>
    </div>

    <div id="panel-channels" class="hidden" style="flex:1; display:flex; flex-direction:column;">
        <div style="padding:10px; background:#1a1a1a; border-bottom:1px solid #333;">
            <button class="btn-back" onclick="showManager()">⬅ Volver a Mis Listas</button>
            <input id="search" placeholder="🔍 Buscar canal..." onkeyup="renderChannels()" style="margin:10px 0 0 0;">
        </div>
        <div id="channel-list"></div>
    </div>

</div>

<div id="main">
    <video id="video" controls autoplay></video>
    <div id="overlay">
        <div id="status-text">Selecciona una lista</div>
    </div>
</div>

<script>
    // CLAVE DE MEMORIA
    const DB_ID = "iptv_v5_final"; 
    
    let playlists = [];
    let activeChannels = [];
    let hls;
    const video = document.getElementById('video');

    // --- INICIO ---
    window.onload = () => {
        try {
            let data = localStorage.getItem(DB_ID);
            if(data) playlists = JSON.parse(data);
        } catch(e) {}
        
        // Demo si está vacío
        if(playlists.length === 0) {
            playlists.push({name: "Demo PlutoTV", url: "https://i.mjh.nz/PlutoTV/ar.m3u8"});
        }
        
        updateUI();
    };

    // --- GESTIÓN DE DATOS ---
    function save() {
        localStorage.setItem(DB_ID, JSON.stringify(playlists));
        updateUI();
    }

    function updateUI() {
        const sel = document.getElementById('listSelect');
        const currentVal = sel.value; // Guardar selección actual si es posible
        sel.innerHTML = "";
        
        playlists.forEach((l, i) => {
            let opt = document.createElement('option');
            opt.value = i;
            opt.innerText = l.name;
            sel.appendChild(opt);
        });

        // Intentar mantener selección o ir al último
        if (currentVal && playlists[currentVal]) {
            sel.value = currentVal;
        } else if (playlists.length > 0) {
            sel.value = 0; 
        }
    }

    function toggleForm() {
        document.getElementById('form-add').classList.toggle('hidden');
    }

    // --- NUEVA FUNCIÓN: GUARDAR Y CARGAR AUTOMÁTICAMENTE ---
    function addListAndLoad() {
        const name = document.getElementById('inpName').value.trim();
        const url = document.getElementById('inpUrl').value.trim();
        
        if(!url.startsWith('https')) return alert("⚠️ Solo se permiten listas HTTPS");
        if(!name || !url) return alert("Completa los datos");

        // 1. Guardar
        playlists.push({name, url});
        save();

        // 2. Limpiar formulario
        document.getElementById('inpName').value = "";
        document.getElementById('inpUrl').value = "";
        document.getElementById('form-add').classList.add('hidden');

        // 3. Seleccionar la nueva lista en el menú (es la última)
        const newIndex = playlists.length - 1;
        document.getElementById('listSelect').value = newIndex;

        // 4. Ejecutar la carga inmediatamente
        loadContent('SINGLE');
    }

    function deleteList() {
        const idx = document.getElementById('listSelect').value;
        if(playlists.length === 0) return;
        
        if(confirm("¿Borrar lista?")) {
            playlists.splice(idx, 1);
            save();
        }
    }

    // --- MOTOR DE CARGA ---
    async function loadContent(mode) {
        const overlay = document.getElementById('overlay');
        const status = document.getElementById('status-text');
        
        overlay.style.display = 'flex';
        status.innerText = "Descargando canales...";
        activeChannels = [];

        let urlsToLoad = [];
        
        if(mode === 'ALL') {
            urlsToLoad = playlists.map(p => p.url);
        } else {
            const idx = document.getElementById('listSelect').value;
            if (idx === "") return;
            urlsToLoad = [playlists[idx].url];
        }

        const promises = urlsToLoad.map(url => 
            fetch('https://corsproxy.io/?' + encodeURIComponent(url))
            .then(r => r.text())
            .catch(e => "")
        );

        const results = await Promise.all(promises);
        results.forEach(txt => parseM3U(txt));

        if(activeChannels.length > 0) {
            // Cambio de interfaz
            document.getElementById('panel-manager').classList.add('hidden');
            document.getElementById('panel-channels').classList.remove('hidden');
            
            renderChannels();
            overlay.style.display = 'none'; // Ocultar overlay
        } else {
            status.innerText = "Error: No se encontraron canales HTTPS.";
            setTimeout(() => { overlay.style.display = 'none'; }, 2000);
        }
    }

    // --- PARSEO CON LOGOS ---
    function parseM3U(data) {
        const lines = data.split('\n');
        let name = "", logo = "";
        
        lines.forEach(line => {
            line = line.trim();
            if(line.startsWith('#EXTINF:')) {
                // Extraer Nombre
                name = line.split(',').pop().trim();
                
                // Extraer Logo (Regex mejorado)
                let logoMatch = line.match(/tvg-logo="([^"]*)"/);
                logo = logoMatch ? logoMatch[1] : "";
                
            } else if(line.startsWith('https://') && name) {
                // Solo guardamos si es HTTPS
                activeChannels.push({name, logo, url: line});
                name = ""; 
                logo = "";
            }
        });
    }

    // --- RENDERIZADO CON ICONOS ---
    function renderChannels() {
        const term = document.getElementById('search').value.toLowerCase();
        const container = document.getElementById('channel-list');
        container.innerHTML = "";

        const filtered = activeChannels.filter(c => c.name.toLowerCase().includes(term));

        // Límite de seguridad de renderizado
        filtered.slice(0, 500).forEach(ch => {
            let div = document.createElement('div');
            div.className = 'channel';
            
            // HTML del Logo (con manejador de error para ocultarlo si falla)
            let logoHTML = ch.logo ? 
                `<img src="${ch.logo}" class="ch-logo" onerror="this.style.display='none'">` : 
                ''; // Si no hay logo, string vacío

            div.innerHTML = `${logoHTML}<span>${ch.name}</span>`;
            div.onclick = () => play(ch.url, div);
            container.appendChild(div);
        });
    }

    function showManager() {
        document.getElementById('panel-channels').classList.add('hidden');
        document.getElementById('panel-manager').classList.remove('hidden');
        document.getElementById('overlay').style.display = 'flex';
        document.getElementById('status-text').innerText = "Selecciona una lista";
    }

    function play(url, el) {
        // Resaltar selección
        document.querySelectorAll('.channel').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        
        if(Hls.isSupported()) {
            if(hls) hls.destroy();
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        } else if(video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.play();
        }
    }
</script>

</body>
</html>
